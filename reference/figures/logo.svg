           treat1= #7C3AED purple  (treatment A)
           treat2= #00BFA5 teal    (treatment B)
           ctrl  = #EF5350 red     (positive control)
           blank = #1a1a2e         (blank/empty)
    -->

    <!-- Helper macro — all wells as circles, r=8 -->
    <!-- ROW A (y=170) -->
    <circle cx="112" cy="170" r="8" fill="#EF5350" opacity="0.9"/>  <!-- ctrl+ -->
    <circle cx="138" cy="170" r="8" fill="#EF5350" opacity="0.9"/>
    <circle cx="164" cy="170" r="8" fill="#7C3AED" opacity="0.88"/>
    <circle cx="190" cy="170" r="8" fill="#7C3AED" opacity="0.88"/>
