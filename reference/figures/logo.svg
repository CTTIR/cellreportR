    <text font-family="monospace" font-size="6.5" fill="#555575" text-anchor="middle" x="164" y="160">3</text>
    <text font-family="monospace" font-size="6.5" fill="#555575" text-anchor="middle" x="190" y="160">4</text>
    <text font-family="monospace" font-size="6.5" fill="#555575" text-anchor="middle" x="216" y="160">5</text>
