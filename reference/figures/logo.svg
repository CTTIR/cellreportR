    <line x1="125" y1="386" x2="125" y2="390" stroke="#ffffff" stroke-width="0.8" opacity="0.4"/>
    <line x1="185" y1="386" x2="185" y2="390" stroke="#ffffff" stroke-width="0.8" opacity="0.4"/>
    <text font-family="monospace" font-size="7" fill="#ffffff" text-anchor="middle" x="155" y="384" opacity="0.55">***</text>

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- REPORT / PAPER ICON — right side                      -->
    <!-- Clean document with lines and a chart thumbnail       -->
    <!-- ══════════════════════════════════════════════════════ -->
    <rect x="326" y="358" width="88" height="112" rx="5"
      fill="#0f0f22" stroke="#3a3a5c" stroke-width="1.2" opacity="0.95"/>

    <!-- Dog-ear fold top-right -->
    <polygon points="390,358 414,358 414,382 390,358"
      fill="#1a1a2e" stroke="#3a3a5c" stroke-width="0.8" opacity="0.85"/>
    <line x1="390" y1="358" x2="414" y2="382" stroke="#3a3a5c" stroke-width="0.8" opacity="0.6"/>

    <!-- Title bar -->
