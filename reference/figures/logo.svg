    <!-- Bar group 2: treat A rep1 (purple) -->
    <rect x="140" y="408" width="14" height="32" rx="2" fill="#7C3AED" opacity="0.85"/>
    <!-- Bar group 2: treat A rep2 -->
    <rect x="156" y="412" width="14" height="28" rx="2" fill="#7C3AED" opacity="0.7"/>
    <!-- Bar group 3: treat B rep1 (teal) -->
    <rect x="178" y="418" width="14" height="22" rx="2" fill="#00BFA5" opacity="0.85"/>
    <!-- Bar group 3: treat B rep2 -->
    <rect x="194" y="422" width="14" height="18" rx="2" fill="#00BFA5" opacity="0.7"/>
    <!-- Bar group 4: blank (dim) -->
    <rect x="216" y="432" width="14" height="8"  rx="2" fill="#3a3a5c" opacity="0.7"/>
    <rect x="232" y="434" width="14" height="6"  rx="2" fill="#3a3a5c" opacity="0.6"/>
