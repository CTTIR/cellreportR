<svg width="500" height="580" viewBox="0 0 500 580" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgcr" x1="0" y1="0" x2="0.1" y2="1">
      <stop offset="0%" stop-color="#3C3489"/>
      <stop offset="100%" stop-color="#3C3489"/>
    </linearGradient>
    <linearGradient id="plategrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#12122a"/>
    </linearGradient>
    <clipPath id="hexcr">
      <polygon points="250,30 455,145 455,375 250,490 45,375 45,145"/>
    </clipPath>
  </defs>

  <polygon points="250,30 455,145 455,375 250,490 45,375 45,145" fill="url(#bgcr)"/>

