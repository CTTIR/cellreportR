    <line x1="147" y1="403" x2="147" y2="414" stroke="#ffffff" stroke-width="1" opacity="0.45"/>
    <line x1="144" y1="403" x2="150" y2="403" stroke="#ffffff" stroke-width="1" opacity="0.45"/>
    <line x1="185" y1="413" x2="185" y2="424" stroke="#ffffff" stroke-width="1" opacity="0.45"/>
    <line x1="182" y1="413" x2="188" y2="413" stroke="#ffffff" stroke-width="1" opacity="0.45"/>

    <!-- Significance brackets -->
