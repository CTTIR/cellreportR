      stroke="#00BFA5" stroke-width="2" opacity="0.6"/>
    <polygon points="244,347 250,355 256,347" fill="#00BFA5" opacity="0.6"/>

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- BAR CHART — analysis output                           -->
    <!-- ══════════════════════════════════════════════════════ -->
    <!-- Chart frame -->
    <rect x="90" y="358" width="224" height="90" rx="4"
      fill="#0d0d1a" stroke="#2a2a4a" stroke-width="1" opacity="0.9"/>

    <!-- Axes -->
    <line x1="108" y1="362" x2="108" y2="440" stroke="#3a3a5c" stroke-width="1" opacity="0.8"/>
    <line x1="108" y1="440" x2="306" y2="440" stroke="#3a3a5c" stroke-width="1" opacity="0.8"/>

    <!-- Tick marks y-axis -->
    <line x1="105" y1="420" x2="108" y2="420" stroke="#3a3a5c" stroke-width="0.8" opacity="0.6"/>
    <line x1="105" y1="400" x2="108" y2="400" stroke="#3a3a5c" stroke-width="0.8" opacity="0.6"/>
    <line x1="105" y1="380" x2="108" y2="380" stroke="#3a3a5c" stroke-width="0.8" opacity="0.6"/>
    <line x1="105" y1="362" x2="108" y2="362" stroke="#3a3a5c" stroke-width="0.8" opacity="0.6"/>

