    <circle cx="320" cy="274" r="8" fill="#00BFA5" opacity="0.68"/>
    <circle cx="346" cy="274" r="8" fill="#00BFA5" opacity="0.68"/>
    <circle cx="372" cy="274" r="8" fill="#2a2a4a" opacity="0.9"/>
    <circle cx="398" cy="274" r="8" fill="#2a2a4a" opacity="0.9"/>

