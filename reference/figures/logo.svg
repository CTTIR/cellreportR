    <circle cx="164" cy="274" r="8" fill="#7C3AED" opacity="0.75"/>
    <circle cx="190" cy="274" r="8" fill="#7C3AED" opacity="0.75"/>
    <circle cx="216" cy="274" r="8" fill="#7C3AED" opacity="0.7"/>
    <circle cx="242" cy="274" r="8" fill="#7C3AED" opacity="0.7"/>
    <circle cx="268" cy="274" r="8" fill="#00BFA5" opacity="0.7"/>
