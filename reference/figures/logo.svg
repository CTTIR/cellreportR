    <circle cx="242" cy="196" r="8" fill="#7C3AED" opacity="0.82"/>
    <circle cx="268" cy="196" r="8" fill="#00BFA5" opacity="0.82"/>
    <circle cx="294" cy="196" r="8" fill="#00BFA5" opacity="0.82"/>
    <circle cx="320" cy="196" r="8" fill="#00BFA5" opacity="0.8"/>
    <circle cx="346" cy="196" r="8" fill="#00BFA5" opacity="0.8"/>
    <circle cx="372" cy="196" r="8" fill="#2a2a4a" opacity="0.9"/>
    <circle cx="398" cy="196" r="8" fill="#2a2a4a" opacity="0.9"/>

    <!-- ROW C (y=222) -->
    <circle cx="112" cy="222" r="8" fill="#2a2a4a" opacity="0.9"/>
    <circle cx="138" cy="222" r="8" fill="#2a2a4a" opacity="0.9"/>
    <circle cx="164" cy="222" r="8" fill="#7C3AED" opacity="0.8"/>
