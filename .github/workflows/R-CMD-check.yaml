# Calls the shared CTTIR workflow. Do not add steps here - change the
# shared one at CTTIR/.github so every package moves together.
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

name: R-CMD-check

permissions: read-all

jobs:
  R-CMD-check:
    uses: CTTIR/.github/.github/workflows/R-CMD-check.yaml@main
    with:
      # Bioconductor 3.18 cytolib requires the matching Boost filesystem API.
      # The archive reference keeps the solver from preferring newer BH headers.
      old-r-extra-packages: "BH=url::https://cran.r-project.org/src/contrib/Archive/BH/BH_1.84.0-0.tar.gz"
      # Suggests Bioconductor packages that pak cannot solve without the
      # Bioconductor repository declared.
      bioc-repository: true
      macos-xquartz: true
